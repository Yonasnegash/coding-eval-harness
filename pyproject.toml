[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-eval-harness"
version = "0.1.0"
description = "A transparent, container-based coding evaluation harness."
requires-python = ">=3.11"

[project.scripts]
eval-harness = "eval_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]