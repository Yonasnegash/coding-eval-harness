name: Test suite

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"

            - name: Install the package
              run: python -m pip install -e .

            - name: Run tests
              run: python -m unittest discover -s tests -v